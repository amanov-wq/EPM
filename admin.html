<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление — EPM</title><link rel="stylesheet" href="style.css"><style>.admin{width:min(1100px,92%);margin:auto;padding:50px 0 90px}.admin-head{text-align:center;margin-bottom:30px}.admin-head h1{font:800 48px Oxanium;margin:10px 0}.admin-head p{color:#9098a5}.admin-card{border:1px solid rgba(255,255,255,.1);background:rgba(12,16,23,.9);border-radius:16px;padding:20px;overflow:auto}.admin-row{display:grid;grid-template-columns:1.3fr 1fr 1.2fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}.admin-row:last-child{border-bottom:0}.admin-name b{display:block;color:#fff}.admin-name small{color:#727b88}.admin-role{color:#aaa0dc}.admin-select{width:100%;background:#11151d;color:#fff;border:1px solid rgba(255,255,255,.12);padding:10px;border-radius:8px}.admin-save{border:1px solid #8170ba;background:#6654a5;color:#fff;border-radius:8px;padding:10px 15px;cursor:pointer}.admin-save:disabled{opacity:.5}.notice{padding:14px;border-radius:10px;margin-bottom:15px;background:rgba(110,85,170,.12);color:#bdb2e7}.error{color:#ff8f9a}@media(max-width:700px){.admin-row{grid-template-columns:1fr}.admin-head h1{font-size:38px}}</style></head><body><header class="topbar"><a class="logo" href="index.html">EPM</a><nav><a href="index.html">Главная</a><a href="forum.html">Форум</a><a href="news.html">Новости</a><a href="rules.html">Правила</a><a href="donate.html">Донат</a></nav></header><main class="admin"><section class="admin-head"><span class="hero-tag">EPM STAFF</span><h1>Управление ролями</h1><p>Назначение ролей пользователям проекта.</p></section><div id="notice"></div><section class="admin-card" id="users">Загрузка...</section></main><footer>EPM © 2026 · Staff Panel</footer><script src="auth.js"></script><script>const roles=['Пользователь','Стример','Стажер','Мл.Хелпер','Хелпер','Ст.Хелпер','Мл.Модератор','Модератор','Ст.Модератор','Куратор по рекламе','Куратор по команде проекта','Зам Куратор','Куратор режима','Создатель'];const token=()=>localStorage.getItem('epmToken')||'';const notice=document.getElementById('notice');const users=document.getElementById('users');function msg(t,err=false){notice.innerHTML='<div class="notice '+(err?'error':'')+'">'+t+'</div>'}async function load(){const r=await fetch('/api/admin/users',{headers:{Authorization:'Bearer '+token()}});const d=await r.json().catch(()=>({}));if(!r.ok){msg(d.error||'Нет доступа',true);users.innerHTML='';return}users.innerHTML=d.users.map(u=>`<div class="admin-row"><div class="admin-name"><b>${esc(u.nickname)}</b><small>ID ${u.id} · ${esc(u.description||'')}</small></div><div class="admin-role">${esc(u.role)}</div><select class="admin-select" data-id="${u.id}">${roles.map(x=>`<option ${x===u.role?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="admin-save" data-id="${u.id}">Сохранить</button></div>`).join('');document.querySelectorAll('.admin-save').forEach(b=>b.onclick=save)}async function save(e){const id=e.currentTarget.dataset.id,select=document.querySelector(`select[data-id="${id}"]`);e.currentTarget.disabled=true;const r=await fetch('/api/admin/users/'+id+'/role',{method:'PATCH',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({role:select.value})});const d=await r.json().catch(()=>({}));e.currentTarget.disabled=false;if(!r.ok)return msg(d.error||'Не удалось изменить роль',true);msg('Роль пользователя обновлена.');load()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load();</script></body></html>
