<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка — EPM</title><link rel="stylesheet" href="style.css">
<style>
.admin{width:min(1150px,92%);margin:auto;padding:46px 0 90px}.admin-head{text-align:center;margin-bottom:28px}.admin-head h1{font:800 clamp(38px,6vw,52px) Oxanium;margin:10px 0}.admin-head p{color:#89929f}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab{border:1px solid rgba(255,255,255,.1);background:#10141b;color:#aeb5c0;border-radius:9px;padding:11px 16px;font:700 11px Oxanium;cursor:pointer}.tab.active{background:#6654a5;border-color:#8e79ce;color:#fff}
.panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.search{flex:1;min-width:220px;background:#11151d;color:#fff;border:1px solid rgba(255,255,255,.12);padding:12px 14px;border-radius:9px;outline:0}.button{border:1px solid rgba(255,255,255,.12);background:#11151c;color:#d7dbe3;border-radius:9px;padding:11px 15px;font:700 11px Oxanium;cursor:pointer}.button.primary{background:#6654a5;border-color:#8170ba;color:#fff}.button.danger{border-color:rgba(210,100,110,.35);color:#e1a1a8}.button:disabled{opacity:.5;cursor:not-allowed}
.card{border:1px solid rgba(255,255,255,.1);background:rgba(12,16,23,.92);border-radius:16px;padding:20px;overflow:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#0c1017}.stat b{display:block;font:800 23px Oxanium;color:#fff}.stat span{color:#747d8a;font-size:11px}
.user-row,.news-row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.07)}.user-row:last-child,.news-row:last-child{border-bottom:0}.name b,.news-main b{display:block;color:#fff;font:700 16px Oxanium}.name small,.news-main small{display:block;color:#707a87;margin-top:5px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{display:inline-flex;gap:6px;align-items:center;margin-top:7px;font-size:11px}.status.active{color:#82dca1}.status.blocked{color:#e08e99}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.modal{display:none;margin-bottom:14px;padding:18px;border:1px solid rgba(129,112,186,.35);background:#0c1017;border-radius:14px}.modal.show{display:block}.modal h2{font:800 23px Oxanium;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:10px}.field label{display:block;color:#9ba4b1;font:700 10px Oxanium;letter-spacing:1px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;background:#080b10;color:#edf0f5;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:11px 12px;outline:0;font:500 13px Arial}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#806bc0}.form-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.notice{margin-bottom:12px;padding:11px 13px;border-radius:9px;background:rgba(110,85,170,.12);color:#c9bde9;font-size:12px}.notice.error{background:rgba(130,45,55,.12);color:#e5a0a8}.empty{text-align:center;color:#747d8a;padding:35px}.news-main{min-width:0;flex:1}.news-main p{color:#858e9a;line-height:1.55;margin:7px 0 0;max-width:780px}.news-meta{color:#9d91ce;font:700 10px Oxanium;letter-spacing:1px}@media(max-width:700px){.admin{padding-top:28px}.stats{grid-template-columns:1fr}.user-row,.news-row{display:block}.actions{margin-top:12px}.actions .button{flex:1}.grid{grid-template-columns:1fr}.toolbar .button{width:100%}}
</style>
</head>
<body>
<header class="topbar"><a class="logo" href="index.html">EPM</a><nav><a href="index.html">Главная</a><a href="server-info.html">⚔️ Сервер</a><a href="forum.html">Форум</a><a href="news.html">Новости</a><a href="rules.html">Правила</a><a href="donate.html">Донат</a><a href="punishments.html">Блокировки</a></nav><div class="account-links"><a href="login.html">Войти</a><a class="account-register" href="register.html">Регистрация</a></div></header>
<main class="admin" id="adminMain" hidden>
<section class="admin-head"><span class="hero-tag">EPM STAFF</span><h1>Админ-панель</h1><p>Доступ для Мл.Хелпера и выше.</p></section>
<div id="notice"></div>
<div class="tabs"><button class="tab active" data-tab="users">👥 Пользователи</button><button class="tab" data-tab="news">📰 Новости</button></div>

<section class="panel active" id="usersPanel">
<div class="stats"><div class="stat"><b id="totalUsers">—</b><span>Всего пользователей</span></div><div class="stat"><b id="activeUsers">—</b><span>Активных</span></div><div class="stat"><b id="blockedUsers">—</b><span>Заблокированных</span></div></div>
<div class="toolbar"><input id="search" class="search" placeholder="Поиск по нику..." autocomplete="off"><button id="refreshUsers" class="button">↻ Обновить</button></div>
<div id="profileModal" class="modal"></div><section class="card" id="users">Проверка доступа...</section>
</section>

<section class="panel" id="newsPanel">
<div class="toolbar"><button id="newNews" class="button primary">＋ Добавить новость</button><button id="refreshNews" class="button">↻ Обновить</button></div>
<div id="newsForm" class="modal">
<h2 id="newsFormTitle">Новая новость</h2>
<div class="grid"><div class="field"><label>Категория</label><select id="newsCategory"><option value="forum">Форум</option><option value="rewards">Награды</option><option value="community">Сообщество</option></select></div><div class="field"><label>Дата</label><input id="newsDate" maxlength="32"></div></div>
<div class="field"><label>Заголовок</label><input id="newsTitle" maxlength="160"></div>
<div class="field"><label>Текст</label><textarea id="newsText" maxlength="3000"></textarea></div>
<div class="field"><label>Ссылка (необязательно)</label><input id="newsLink" maxlength="160" placeholder="forum.html"></div>
<div class="form-actions"><button id="saveNews" class="button primary">Сохранить</button><button id="cancelNews" class="button">Отмена</button></div>
</div>
<section class="card" id="newsList">Загрузка новостей...</section>
</section>
</main>
<footer>EPM © 2026 · Staff Panel</footer>
<script src="auth.js"></script>
<script>
const token=()=>localStorage.getItem('epmToken')||'';let currentMe=null;
const notice=document.getElementById('notice');let allUsers=[],allNews=[],editingNewsId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const date=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ru-RU')};
const msg=(s,error=false)=>{notice.innerHTML='<div class="notice '+(error?'error':'')+'">'+esc(s)+'</div>';setTimeout(()=>notice.innerHTML='',2800)};
async function api(url,options={}){const headers={...(options.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,{...options,headers,cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка запроса');return d}

function renderUsers(){const q=document.getElementById('search').value.trim().toLowerCase(),list=allUsers.filter(u=>String(u.nickname||'').toLowerCase().includes(q));totalUsers.textContent=allUsers.length;activeUsers.textContent=allUsers.filter(u=>!u.blocked).length;blockedUsers.textContent=allUsers.filter(u=>u.blocked).length;if(!list.length){users.innerHTML='<div class="empty">Пользователи не найдены.</div>';return}users.innerHTML=list.map(u=>{const blocked=Boolean(u.blocked);return '<div class="user-row"><div class="name"><b>'+esc(u.nickname)+'</b><small>ID '+Number(u.id)+' · Роль: '+esc(u.role||'Пользователь')+' · Тем: '+Number(u.topics||0)+' · Ответов: '+Number(u.posts||0)+'<br>Регистрация: '+esc(date(u.createdAt))+'</small><span class="status '+(blocked?'blocked':'active')+'"><i class="dot"></i>'+(blocked?'Заблокирован':'Активен')+'</span></div><div class="actions"><button class="button" data-profile="'+Number(u.id)+'">Профиль</button>'+(blocked?'<button class="button" data-status="'+Number(u.id)+'" data-next="false">Разблокировать</button>':'<button class="button danger" data-status="'+Number(u.id)+'" data-next="true">Заблокировать</button>')+'</div></div>'}).join('');document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>showProfile(Number(b.dataset.profile)));document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>changeStatus(Number(b.dataset.status),b,b.dataset.next==='true'));document.querySelectorAll('[data-role-open]').forEach(b=>b.onclick=()=>showProfile(Number(b.dataset.profile),true))}
function showProfile(id,focusRole=false){const u=allUsers.find(x=>Number(x.id)===id);if(!u)return;const roleOptions=['Пользователь','Стример','Стажер','Мл.Хелпер','Хелпер','Ст.Хелпер','Мл.Модератор','Модератор','Ст.Модератор','Куратор по рекламе','Куратор по команде проекта','Зам Куратор','Куратор режима','Создатель'];const roleBox=currentMe?.role==='Создатель'&&Number(u.id)!==Number(currentMe.id)?'<div class="field" style="margin-top:14px"><label>Роль</label><select id="roleSelect">'+roleOptions.map(r=>'<option '+(r===u.role?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select><button class="button primary" style="margin-top:9px" onclick="changeRole('+Number(u.id)+')">Сохранить роль</button></div>':'';profileModal.innerHTML='<h2>Профиль: '+esc(u.nickname)+'</h2><div class="grid"><div>Ник: <b>'+esc(u.nickname)+'</b></div><div>Роль: <b>'+esc(u.role||'Пользователь')+'</b></div><div>Статус: <b>'+(u.blocked?'Заблокирован':'Активен')+'</b></div><div>Дата: <b>'+esc(date(u.createdAt))+'</b></div><div>Темы: <b>'+Number(u.topics||0)+'</b></div><div>Ответы: <b>'+Number(u.posts||0)+'</b></div></div><div style="margin-top:12px;color:#89929f">'+esc(u.description||'Описание отсутствует')+'</div>'+roleBox+'<button class="button" style="margin-top:14px" onclick="profileModal.classList.remove(\'show\')">Закрыть</button>';profileModal.classList.add('show');if(focusRole)document.getElementById('roleSelect')?.focus()}
async function changeRole(id){const select=document.getElementById('roleSelect');if(!select)return;try{const d=await api('/api/admin/users/'+id+'/role',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:select.value})});const i=allUsers.findIndex(u=>Number(u.id)===id);if(i>=0)allUsers[i]={...allUsers[i],...(d.user||{})};profileModal.classList.remove('show');msg('Роль пользователя изменена.');renderUsers()}catch(e){msg(e.message,true)}}
async function changeStatus(id,b,next){b.disabled=true;try{const d=await api('/api/admin/users/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({blocked:next})});const i=allUsers.findIndex(u=>Number(u.id)===id);if(i>=0)allUsers[i]={...allUsers[i],...(d.user||{}),blocked:next};msg(next?'Пользователь заблокирован.':'Пользователь разблокирован.');renderUsers()}catch(e){msg(e.message,true);b.disabled=false}}
async function loadUsers(){try{const d=await api('/api/admin/users');allUsers=Array.isArray(d.users)?d.users:[];renderUsers()}catch(e){document.getElementById('users').innerHTML='<div class="empty">'+esc(e.message)+'</div>';msg(e.message,true)}}

function renderNews(){if(!allNews.length){newsList.innerHTML='<div class="empty">Новостей пока нет.</div>';return}newsList.innerHTML=allNews.map(n=>'<article class="news-row"><div class="news-main"><span class="news-meta">'+esc(n.category||'community')+' · '+esc(n.date||'')+'</span><b>'+esc(n.title)+'</b><p>'+esc(n.text)+'</p><small>'+esc(n.link||'Без ссылки')+'</small></div><div class="actions"><button class="button" data-edit-news="'+Number(n.id)+'">Изменить</button><button class="button danger" data-delete-news="'+Number(n.id)+'">Удалить</button></div></article>').join('');document.querySelectorAll('[data-edit-news]').forEach(b=>b.onclick=()=>editNews(Number(b.dataset.editNews)));document.querySelectorAll('[data-delete-news]').forEach(b=>b.onclick=()=>deleteNews(Number(b.dataset.deleteNews)))}
function openNewsForm(item=null){editingNewsId=item?Number(item.id):null;newsFormTitle.textContent=item?'Редактировать новость':'Новая новость';newsCategory.value=item?.category||'community';newsDate.value=item?.date||new Date().toLocaleDateString('ru-RU');newsTitle.value=item?.title||'';newsText.value=item?.text||'';newsLink.value=item?.link||'';newsForm.classList.add('show');newsForm.scrollIntoView({behavior:'smooth',block:'nearest'})}
function editNews(id){const item=allNews.find(n=>Number(n.id)===id);if(item)openNewsForm(item)}
async function loadNews(){try{const d=await fetch('/api/news',{cache:'no-store'}).then(async r=>{const x=await r.json();if(!r.ok)throw new Error(x.error||'Ошибка загрузки');return x});allNews=Array.isArray(d)?d:[];renderNews()}catch(e){newsList.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function saveNewsItem(){saveNews.disabled=true;try{const body={category:newsCategory.value,title:newsTitle.value.trim(),text:newsText.value.trim(),date:newsDate.value.trim(),link:newsLink.value.trim()};const d=await api(editingNewsId?'/api/admin/news/'+editingNewsId:'/api/admin/news',{method:editingNewsId?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});msg(editingNewsId?'Новость обновлена.':'Новость создана.');newsForm.classList.remove('show');editingNewsId=null;await loadNews()}catch(e){msg(e.message,true)}finally{saveNews.disabled=false}}
async function deleteNews(id){if(!confirm('Удалить эту новость?'))return;try{await api('/api/admin/news/'+id,{method:'DELETE'});msg('Новость удалена.');await loadNews()}catch(e){msg(e.message,true)}}

document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.getElementById(tab.dataset.tab+'Panel').classList.add('active');if(tab.dataset.tab==='news')loadNews()});
document.getElementById('search').oninput=renderUsers;document.getElementById('refreshUsers').onclick=loadUsers;document.getElementById('refreshNews').onclick=loadNews;document.getElementById('newNews').onclick=()=>openNewsForm();document.getElementById('cancelNews').onclick=()=>newsForm.classList.remove('show');document.getElementById('saveNews').onclick=saveNewsItem;
(async()=>{try{const me=await api('/api/auth/me');currentMe=me.user;document.getElementById('adminMain').hidden=false;if(!me.user||!['Мл.Хелпер','Хелпер','Ст.Хелпер','Мл.Модератор','Модератор','Ст.Модератор','Куратор по рекламе','Куратор по команде проекта','Зам Куратор','Куратор режима','Создатель'].includes(me.user.role))throw new Error('Админ-панель доступна сотрудникам с роли «Мл.Хелпер» и выше.');await loadUsers()}catch(e){document.querySelector('.admin').innerHTML='<section class="admin-head"><span class="hero-tag">EPM STAFF</span><h1>Нет доступа</h1><p>'+esc(e.message)+'</p><a class="button primary" href="index.html">Вернуться на сайт</a></section>'}})();
</script>
</body></html>
