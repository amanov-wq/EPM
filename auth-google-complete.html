<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Вход через Google — EPM</title>
<link rel="stylesheet" href="style.css">
<style>
.google-complete-page{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:32px 18px}.google-complete-card{width:min(480px,100%);padding:34px;background:rgba(10,13,18,.96);border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center}.google-complete-card h1{font:600 30px/1.1 Oxanium;margin:0 0 12px}.google-complete-card p{color:#9ca4b1;margin:0;line-height:1.6}.google-complete-mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 20px;border-radius:50%;background:#f7f7f7;color:#4285f4;font:bold 34px Arial}.google-complete-link{display:inline-block;margin-top:20px;color:#b6a8f0}
</style>
</head>
<body>
<header class="topbar"><a class="logo" href="index.html">EPM</a><nav><a href="index.html">Главная</a><a href="forum.html">Форум</a><a href="news.html">Новости</a><a href="rules.html">Правила</a><a href="donate.html">Донат</a></nav><div class="account-links"><a href="login.html">Войти</a></div></header>
<main class="google-complete-page"><section class="google-complete-card"><div class="google-complete-mark">G</div><h1 id="title">Завершаем вход</h1><p id="message">Подключаем твой аккаунт Google к EPM…</p><a class="google-complete-link" href="login.html" id="back" hidden>Вернуться ко входу</a></section></main>
<script src="auth.js"></script>
<script>
(async()=>{
 const title=document.getElementById('title'),message=document.getElementById('message'),back=document.getElementById('back');
 const code=new URLSearchParams(location.search).get('code')||'';
 try{history.replaceState({},'',location.pathname);
  if(!code)throw new Error('Ссылка входа устарела. Вернись на страницу входа и попробуй снова.');
  const r=await fetch('/api/auth/google/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code}),cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Не удалось завершить вход через Google.');
  window.EPMAuth.saveSession(d);
  await window.EPMAuth.startPresence();
  title.textContent='Вход выполнен';
  message.textContent='Перенаправляем в твой профиль EPM…';
  location.replace('profile.html');
 }catch(error){title.textContent='Не удалось войти';message.textContent=error.message||'Попробуй ещё раз.';back.hidden=false}
})();
</script>
</body>
</html>
