<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поиск — EPM</title><link rel="stylesheet" href="style.css"><style>
.search-page{width:min(1050px,92%);margin:auto;padding:55px 0 90px}.search-box{padding:30px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(145deg,rgba(18,21,29,.97),rgba(7,10,15,.97));box-shadow:0 20px 60px rgba(0,0,0,.3)}.search-kicker{color:#8f79d1;font:600 10px Oxanium;letter-spacing:2px;text-transform:uppercase}.search-box h1{margin:10px 0 8px;font:800 clamp(38px,6vw,58px) Oxanium}.search-box p{margin:0;color:#7f8895}.search-form{display:flex;gap:10px;margin-top:24px}.search-form input{flex:1;min-width:0;height:52px;padding:0 16px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#080b10;color:#edf0f5;font:500 15px Rajdhani;outline:none}.search-form input:focus{border-color:rgba(143,121,209,.7)}.search-form button{height:52px;padding:0 24px;border:1px solid rgba(164,143,232,.7);border-radius:10px;background:linear-gradient(135deg,#5c4a99,#8b74d0);color:#fff;font:700 12px Oxanium;cursor:pointer}.search-results{margin-top:14px;display:grid;gap:10px}.search-result{display:block;padding:17px 19px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:linear-gradient(145deg,rgba(16,20,28,.96),rgba(8,11,16,.96));text-decoration:none}.search-result:hover{border-color:rgba(143,121,209,.3)}.search-result b{display:block;color:#e1e4e9;font:600 14px Oxanium}.search-result span{display:block;margin-top:5px;color:#707a87;font-size:12px}.search-empty{padding:25px;text-align:center;color:#707987}@media(max-width:600px){.search-page{padding-top:30px}.search-box{padding:22px 16px}.search-form{display:block}.search-form button{width:100%;margin-top:10px}}
</style></head><body><header class="topbar"><a class="logo" href="index.html">EPM</a><nav></nav><div class="account-links"></div></header><main class="search-page"><section class="search-box"><div class="search-kicker">EPM SEARCH</div><h1>Поиск</h1><p>Поиск по темам форума EPM.</p><form class="search-form" id="searchForm"><input id="searchInput" autocomplete="off" placeholder="Введите запрос..." maxlength="80"><button type="submit">Найти</button></form><div class="search-results" id="results"><div class="search-empty">Введите запрос для поиска.</div></div></section></main><footer class="site-footer">EPM © 2026 · Minecraft Community</footer><script src="auth.js"></script><script>
const input=document.getElementById('searchInput'),results=document.getElementById('results'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function search(){const q=input.value.trim().toLowerCase();if(!q){results.innerHTML='<div class="search-empty">Введите запрос для поиска.</div>';return}results.innerHTML='<div class="search-empty">Поиск...</div>';try{const r=await fetch('/api/topics',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error();const topics=d.topics||d||[],found=topics.filter(t=>[t.title,t.author,t.nickname,t.categoryName,t.category].join(' ').toLowerCase().includes(q)).slice(0,30);results.innerHTML=found.length?found.map(t=>'<a class="search-result" href="topic.html?id='+Number(t.id)+'"><b>'+esc(t.title||'Без названия')+'</b><span>Форум · '+esc(t.nickname||t.author||'Пользователь')+'</span></a>').join(''):'<div class="search-empty">Ничего не найдено.</div>'}catch{results.innerHTML='<div class="search-empty">Не удалось выполнить поиск.</div>'}}
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();search()};</script></body></html>
