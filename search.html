<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поиск людей — EPM</title><link rel="stylesheet" href="style.css"><style>
.search-page{width:min(1050px,92%);margin:auto;padding:55px 0 90px}.search-box{padding:30px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(145deg,rgba(18,21,29,.97),rgba(7,10,15,.97));box-shadow:0 20px 60px rgba(0,0,0,.3)}.search-kicker{color:#8f79d1;font:600 10px Oxanium;letter-spacing:2px;text-transform:uppercase}.search-box h1{margin:10px 0 8px;font:800 clamp(38px,6vw,58px) Oxanium}.search-box p{margin:0;color:#7f8895}.search-form{display:flex;gap:10px;margin-top:24px}.search-form input{flex:1;min-width:0;height:52px;padding:0 16px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#080b10;color:#edf0f5;font:500 15px Rajdhani;outline:none}.search-form input:focus{border-color:rgba(143,121,209,.7)}.search-form button{height:52px;padding:0 24px;border:1px solid rgba(164,143,232,.7);border-radius:10px;background:linear-gradient(135deg,#5c4a99,#8b74d0);color:#fff;font:700 12px Oxanium;cursor:pointer}.search-results{margin-top:14px;display:grid;gap:10px}.search-hint{margin-top:14px;color:#858e9b;font-size:12px}.search-result{display:flex;align-items:center;gap:14px;padding:14px 17px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:linear-gradient(145deg,rgba(16,20,28,.96),rgba(8,11,16,.96));text-decoration:none}.search-result:hover{border-color:rgba(143,121,209,.3);transform:translateY(-1px)}.search-avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;object-fit:cover;background:#151a23;border:1px solid rgba(255,255,255,.1)}.search-info{min-width:0}.search-result b{display:block;color:#e1e4e9;font:600 14px Oxanium}.search-result span{display:block;margin-top:5px;color:#707a87;font-size:12px}.search-empty{padding:25px;text-align:center;color:#707987}@media(max-width:600px){.search-page{padding-top:30px}.search-box{padding:22px 16px}.search-form{display:block}.search-form button{width:100%;margin-top:10px}}
</style></head><body><header class="topbar"><a class="logo" href="index.html">EPM</a><nav><a href="index.html">Главная</a><a href="forum.html">Форум</a><a href="news.html">Новости</a><a href="rules.html">Правила</a><a href="donate.html">Донат</a><a href="punishments.html">Блокировки</a><a href="server-info.html">Сервер</a><a href="battlepass.html">Battle Pass</a><a href="search.html" class="active">Поиск</a><a href="socials.html">Соцсети</a></nav><div class="account-links"></div></header><main class="search-page"><section class="search-box"><div class="search-kicker">EPM PEOPLE</div><h1>Поиск людей</h1><p>Найди пользователя EPM по нику. Темы форума в поиске не отображаются.</p><form class="search-form" id="searchForm"><input id="searchInput" autocomplete="off" placeholder="Введите ник..." maxlength="24"><button type="submit">Найти</button></form><div class="search-hint" id="searchHint" aria-live="polite">Начни вводить ник — подсказки появятся после 2 букв.</div><div class="search-results" id="results" aria-live="polite"><div class="search-empty">Введите ник для поиска.</div></div></section></main><footer class="site-footer">EPM © 2026 · Minecraft Community</footer><script src="auth.js"></script><script>
const input=document.getElementById('searchInput'),results=document.getElementById('results'),searchHint=document.getElementById('searchHint'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function epmRoleClass(role){const roles=["Пользователь","Стример","Стажер","Мл.Хелпер","Хелпер","Ст.Хелпер","Мл.Модератор","Модератор","Ст.Модератор","Куратор по рекламе","Куратор по команде проекта","Зам Куратор","Куратор режима","Создатель"];const classes=["role-user","role-streamer","role-trainee","role-junior-helper","role-helper","role-senior-helper","role-junior-moderator","role-moderator","role-senior-moderator","role-ad-curator","role-team-curator","role-deputy-curator","role-mode-curator","role-creator"];const i=roles.indexOf(String(role||'Пользователь'));return classes[i<0?0:i]}
let searchTimer=null,searchSequence=0,lastQuery='';
function renderUsers(users){
  results.innerHTML=users.length?users.map(u=>{
    const avatar=u.avatar?String(u.avatar):'images/default-avatar.png';
    const fallback="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23151a23'/%3E%3Ccircle cx='32' cy='24' r='12' fill='%238f79d1'/%3E%3Cpath d='M10 60c1-14 10-22 22-22s21 8 22 22' fill='%238f79d1'/%3E%3C/svg%3E";
    return '<a class="search-result" href="profile.html?id='+Number(u.id)+'"><img class="search-avatar" src="'+esc(avatar)+'" onerror="this.onerror=null;this.src=\''+fallback+'\'" alt="Аватар '+esc(u.nickname||'пользователя')+'"><div class="search-info"><b>'+esc(u.nickname||'Пользователь')+'</b><span class="epm-role '+epmRoleClass(u.role)+'">'+esc(u.role||'Пользователь')+'</span></div></a>';
  }).join(''):'<div class="search-empty">Пользователи не найдены.</div>';
}
async function search(){
  const q=input.value.trim(),sequence=++searchSequence;
  if(q.length<2){lastQuery='';results.innerHTML='<div class="search-empty">Введите ник для поиска.</div>';searchHint.textContent='Начни вводить ник — подсказки появятся после 2 букв.';return}
  lastQuery=q;searchHint.textContent='Подсказки по нику «'+q+'»';results.innerHTML='<div class="search-empty">Ищем пользователей…</div>';
  try{
    const r=await fetch('/api/users/search?q='+encodeURIComponent(q),{cache:'no-store'}),d=await r.json();
    if(sequence!==searchSequence||input.value.trim()!==q)return;
    if(!r.ok)throw Error();
    renderUsers(Array.isArray(d.users)?d.users:[]);
    searchHint.textContent=(d.users||[]).length?'Найденные люди — нажми на пользователя, чтобы открыть профиль.':'Совпадений по нику «'+q+'» нет.';
  }catch{
    if(sequence!==searchSequence)return;
    results.innerHTML='<div class="search-empty">Не удалось выполнить поиск людей.</div>';searchHint.textContent='Проверь подключение и попробуй ещё раз.';
  }
}
function scheduleSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(search,180)}
input.addEventListener('input',scheduleSearch);
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();clearTimeout(searchTimer);search()};
</script></body></html>
