<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090d"><title>Блокировки — EPM</title>
<link rel="stylesheet" href="style.css">
<style>
.pun-page{width:min(1180px,92%);margin:auto;padding:42px 0 90px}.pun-head{padding:30px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:linear-gradient(145deg,rgba(17,21,29,.97),rgba(7,10,15,.96));margin-bottom:14px}.pun-kicker{color:#8f79d1;font:700 11px Oxanium;letter-spacing:2px;text-transform:uppercase}.pun-head h1{margin:8px 0;font:800 clamp(34px,6vw,58px)/1 Oxanium}.pun-head p{margin:0;color:#78818e;max-width:760px}.pun-actions{margin-top:20px;display:flex;gap:10px}.pun-btn{height:44px;padding:0 18px;border:1px solid rgba(143,121,209,.45);border-radius:10px;background:linear-gradient(135deg,#514184,#806bc0);color:#fff;font:700 12px Oxanium;cursor:pointer}.pun-btn.secondary{background:#11151d;border-color:rgba(255,255,255,.1)}.pun-list{border:1px solid rgba(255,255,255,.09);border-radius:17px;overflow:hidden;background:rgba(10,13,18,.94)}.pun-item{display:grid;grid-template-columns:170px minmax(220px,1fr) 150px 150px 160px;gap:14px;padding:17px 20px;border-bottom:1px solid rgba(255,255,255,.06);align-items:center}.pun-item:last-child{border-bottom:0}.pun-item.head{color:#69727f;font:700 10px Oxanium;text-transform:uppercase;letter-spacing:1px;background:rgba(255,255,255,.02)}.pun-nick{font:700 15px Oxanium;color:#e7e9ed}.pun-reason{color:#b5bbc5;font-size:13px;line-height:1.45}.pun-mod{color:#9e8dd4;font:600 12px Oxanium}.pun-date,.pun-exp{color:#69727f;font-size:11px}.pun-mode{display:inline-block;margin-top:5px;padding:4px 7px;border-radius:6px;background:rgba(143,121,209,.12);color:#a995db;font:700 10px Oxanium}.pun-empty{padding:45px 20px;text-align:center;color:#68717e}.modal-box{max-width:560px}.form-row{margin:14px 0}.form-row label{display:block;margin-bottom:7px;color:#aeb5c0;font:600 11px Oxanium;text-transform:uppercase;letter-spacing:1px}.form-row input,.form-row textarea,.form-row select{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:#080b10;color:#edf0f5;padding:12px;font:500 14px Rajdhani;outline:none}.form-row textarea{min-height:120px;resize:vertical}.form-error{color:#ff7777;font-size:12px;min-height:18px}
@media(max-width:1050px){.pun-item{grid-template-columns:150px 1fr 130px 130px}.pun-item .pun-exp{display:none}}
@media(max-width:800px){.pun-item{grid-template-columns:1fr 1fr}.pun-item.head{display:none}.pun-reason{grid-column:1/-1}.pun-date{text-align:right}}
@media(max-width:520px){.pun-page{width:calc(100% - 24px);padding-top:28px}.pun-head{padding:23px 18px}.pun-item{display:block}.pun-item>*{margin:6px 0}.pun-actions{display:block}.pun-btn{width:100%;margin-bottom:8px}}
 .pun-search{margin-top:14px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:#080b10}.pun-search span{color:#8f79d1;font-size:22px}.pun-search input{width:100%;height:46px;border:0;outline:0;background:transparent;color:#edf0f5;font:500 14px Rajdhani}.tab.active{border-color:rgba(143,121,209,.75);box-shadow:0 0 18px rgba(143,121,209,.12)}</style>
</head>
<body>
<header class="topbar"><a class="logo" href="index.html">EPM</a><nav><a href="index.html">Главная</a><a href="server-info.html">⚔️ Сервер</a><a href="forum.html">Форум</a><a href="news.html">Новости</a><a href="rules.html">Правила</a><a href="donate.html">Донат</a><a href="punishments.html" class="active">Блокировки</a></nav><div class="account-links"><a href="login.html">Войти</a><a class="account-register" href="register.html">Регистрация</a></div></header>
<main class="pun-page">
<section class="pun-head">
  <div class="pun-kicker">История наказаний EPM</div>
  <h1>Блокировки</h1>
  <p>Блокировки Minecraft-серверов и отдельная история разблокировок.</p>
  <div class="pun-actions">
    <button class="pun-btn secondary tab active" data-tab="bans">🔨 Блокировки</button>
    <button class="pun-btn secondary tab" data-tab="unbans">🔓 Разблокировки</button>
    <button class="pun-btn secondary" id="refreshBtn">↻ Обновить</button>
    <button class="pun-btn" id="addBtn" hidden>＋ Добавить блокировку</button>
  </div>
  <div class="pun-search"><span>⌕</span><input id="search" placeholder="Поиск по нику, причине, модератору или режиму..." autocomplete="off"></div>
</section>
<section class="pun-list" id="list"><div class="pun-empty">Загрузка...</div></section>
</main>
<footer class="site-footer">EPM © 2026 · Minecraft Community</footer>
<div class="modal" id="modal" hidden><div class="modal-box"><button class="modal-close" id="closeModal">×</button><h2>Добавить блокировку</h2><p class="modal-subtitle">Ручная запись для команды проекта.</p><form id="form"><div class="form-row"><label>Ник игрока</label><input id="nickname" maxlength="24" required></div><div class="form-row"><label>Причина</label><textarea id="reason" maxlength="500" required></textarea></div><div class="form-row"><label>Режим</label><select id="mode"><option>Estamon Grief</option><option>Estamon Creative</option><option>Estamon Survial</option></select></div><div class="form-error" id="error"></div><button class="pun-btn" type="submit">Опубликовать</button></form></div></div>
<script>
const list=document.getElementById('list'),addBtn=document.getElementById('addBtn'),modal=document.getElementById('modal');
const token=localStorage.getItem('epmToken')||'',roles=['Пользователь','Стример','Стажер','Мл.Хелпер','Хелпер','Ст.Хелпер','Мл.Модератор','Модератор','Ст.Модератор','Куратор по рекламе','Куратор по команде проекта','Зам Куратор','Куратор режима','Создатель'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmt=v=>{if(!v)return '—';try{return new Date(v).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})}catch{return v}};
let bans=[],unbans=[],tab='bans';
function matches(p){
 const q=document.getElementById('search').value.trim().toLowerCase();
 if(!q)return true;
 return [p.nickname,p.reason,p.moderator,p.mode,p.server,p.type,p.punishmentId].join(' ').toLowerCase().includes(q);
}
function render(){
 const rows=tab==='bans'?bans.filter(matches):unbans.filter(matches);
 if(!rows.length){list.innerHTML='<div class="pun-empty">'+(document.getElementById('search').value?'Ничего не найдено.':tab==='bans'?'Блокировок пока нет.':'Разблокировок пока нет.')+'</div>';return}
 if(tab==='bans'){
   list.innerHTML='<div class="pun-item head"><div>Игрок</div><div>Причина</div><div>Модератор</div><div>Режим</div><div>Окончание</div></div>'+
   rows.map(p=>{
     return '<div class="pun-item"><div class="pun-nick">🔨 '+esc(p.nickname)+'</div><div class="pun-reason">'+esc(p.reason)+'</div><div class="pun-mod">'+esc(p.moderator)+'</div><div><span class="pun-mode">'+esc(p.mode||p.server||'EPM')+'</span></div><div class="pun-exp">'+esc(fmt(p.expiresAt))+'<br><small>'+esc(fmt(p.createdAt))+'</small></div></div>'
   }).join('');
 }else{
   list.innerHTML='<div class="pun-item head"><div>Игрок</div><div>Режим</div><div>Дата</div></div>'+
   rows.map(p=>'<div class="pun-item"><div class="pun-nick">🔓 '+esc(p.nickname)+'</div><div class="pun-reason">'+esc(p.mode||p.server||'EPM')+'</div><div class="pun-date">'+esc(fmt(p.createdAt))+'</div></div>').join('');
 }
}
async function load(){
 try{
   const [a,b]=await Promise.all([fetch('/api/punishments',{cache:'no-store'}),fetch('/api/unbans',{cache:'no-store'})]);
   const ad=await a.json(),bd=await b.json();
   if(!a.ok||!b.ok)throw Error();
   bans=ad.punishments||[];unbans=bd.unbans||[];render();
 }catch{list.innerHTML='<div class="pun-empty">Не удалось загрузить историю блокировок.</div>'}
}
async function access(){
 if(!token)return;
 try{
   const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}}),d=await r.json();
   const level=roles.indexOf(d.user?.role);
   if(level>=8)addBtn.hidden=false;
 }catch{}
}
document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{tab=btn.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));render()});
document.getElementById('search').oninput=render;
document.getElementById('refreshBtn').onclick=load;
addBtn.onclick=()=>modal.hidden=false;
document.getElementById('closeModal').onclick=()=>modal.hidden=true;
modal.onclick=e=>{if(e.target===modal)modal.hidden=true};
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const er=document.getElementById('error');er.textContent='';try{const r=await fetch('/api/punishments',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({nickname:document.getElementById('nickname').value,reason:document.getElementById('reason').value,mode:document.getElementById('mode').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');modal.hidden=true;e.target.reset();load()}catch(x){er.textContent=x.message}};
load();access();
</script></script><script src="auth.js"></script>
</body></html>
