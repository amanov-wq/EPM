<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль — EPM</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo" href="index.html">EPM</a><nav><a href="index.html">Главная</a><a href="forum.html">Форум</a><a href="rules.html">Правила</a><a href="donate.html">Донат</a></nav><a class="profile" href="profile.html">Профиль</a></header><main class="container profile-page"><div id="guest" class="auth-box"><span class="eyebrow">EPM ACCOUNT</span><h1>Вы гость</h1><p>Войдите или зарегистрируйтесь, чтобы открыть профиль.</p><div class="actions"><a class="btn primary" href="register.html">Зарегистрироваться</a><a class="btn" href="login.html">Войти</a></div></div><section id="user" class="profile-card" hidden><div class="profile-avatar" id="avatar">EPM</div><div><span class="eyebrow">PROFILE</span><h1 id="nickname">—</h1><span class="role" id="role">Пользователь</span><p id="description">Добро пожаловать в EPM.</p></div><button class="btn" id="logout">Выйти</button></section></main><script>const token=localStorage.getItem('epmToken');const guest=document.getElementById('guest'),user=document.getElementById('user');if(token){fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{guest.hidden=true;user.hidden=false;nickname.textContent=d.user.nickname;role.textContent=d.user.role;description.textContent=d.user.description||'Пользователь EPM';avatar.textContent=d.user.nickname.slice(0,2).toUpperCase()}).catch(()=>localStorage.removeItem('epmToken'))}logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+localStorage.getItem('epmToken')}}).catch(()=>{});localStorage.removeItem('epmToken');localStorage.removeItem('user');location.href='index.html'}</script></body></html>
