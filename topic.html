<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>Тема — EPM</title>
<link rel="stylesheet" href="style.css">
<style>
.topic-page{width:min(1120px,92%);margin:auto;padding:42px 0 90px}.topic-back{display:inline-flex;align-items:center;gap:8px;color:#858e9b;font:600 12px Oxanium;text-decoration:none;letter-spacing:.5px;margin-bottom:18px}.topic-back:hover{color:#c9bdf0}.topic-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}.topic-main{min-width:0}.topic-card,.reply-card,.reply-composer,.topic-side{background:linear-gradient(145deg,rgba(18,21,29,.97),rgba(8,11,16,.97));border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.22)}.topic-card{border-radius:20px;padding:28px}.topic-kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#a99bd4;font:700 11px Oxanium;letter-spacing:1.4px;text-transform:uppercase}.topic-badge{padding:5px 9px;border-radius:7px;background:rgba(117,101,181,.12);border:1px solid rgba(117,101,181,.18);color:#bdb1df}.topic-badge.closed{color:#d49a9a;background:rgba(150,60,60,.1);border-color:rgba(190,90,90,.18)}.topic-title{font:700 clamp(28px,5vw,46px)/1.12 Oxanium;color:#eef0f5;margin:15px 0 18px;word-break:break-word}.topic-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#727c89;font-size:12px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:20px}.author-inline{display:inline-flex;align-items:center;gap:9px;color:#c9bfe0;font:700 12px Oxanium}.topic-avatar,.reply-avatar{overflow:hidden;flex:none;background:linear-gradient(145deg,#211d31,#11141c);border:1px solid rgba(139,119,205,.25);color:#d8cdf7;font:700 12px Oxanium}.topic-avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}.topic-avatar img,.reply-avatar img{width:100%;height:100%;object-fit:cover;display:block}.topic-content{padding:24px 0;color:#b8bec8;font-size:15px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.topic-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:3px}.topic-btn{border:1px solid rgba(255,255,255,.1);border-radius:9px;background:#11151c;color:#d0d4dc;padding:10px 14px;font:700 11px Oxanium;cursor:pointer;transition:.2s}.topic-btn:hover{border-color:#8e79ce;color:#eee8ff;transform:translateY(-1px)}.topic-btn.danger:hover{border-color:#a95d5d;color:#efb1b1}.topic-side{border-radius:18px;padding:20px;height:max-content;position:sticky;top:85px}.side-title{font:700 13px Oxanium;color:#e3e5ea;text-transform:uppercase;letter-spacing:1px;margin-bottom:15px}.side-stat{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}.side-stat:last-child{border-bottom:0}.side-stat span{color:#717b88}.side-stat b{color:#d8dce3;font:700 12px Oxanium;text-align:right}.replies-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:28px 0 12px}.replies-head h2{font:700 20px Oxanium;margin:0;color:#e9ebef}.replies-head span{color:#707986;font:600 11px Oxanium}.reply-card{border-radius:17px;padding:20px;margin:10px 0;display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px}.reply-user{border-right:1px solid rgba(255,255,255,.07);padding-right:18px}.reply-avatar{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:11px}.reply-user strong{display:block;color:#d8dbe1;font:700 13px Oxanium;overflow-wrap:anywhere}.reply-role{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:6px;background:rgba(117,101,181,.1);color:#aa9bd1;font:600 9px Oxanium;max-width:100%;overflow-wrap:anywhere}.reply-date{display:block;margin-top:10px;color:#66707d;font-size:10px}.reply-content{color:#b8bec8;font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.reply-composer{border-radius:17px;padding:20px;margin-top:16px}.composer-title{font:700 14px Oxanium;color:#e1e3e8;margin-bottom:12px}.reply-composer textarea{width:100%;min-height:135px;box-sizing:border-box;resize:vertical;background:#090c11;border:1px solid rgba(255,255,255,.09);border-radius:11px;color:#e8eaf0;padding:14px;outline:0;font:14px/1.7 Arial,sans-serif}.reply-composer textarea:focus{border-color:rgba(139,111,232,.55);box-shadow:0 0 0 3px rgba(139,111,232,.08)}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.composer-hint{color:#626c78;font-size:10px}.reply-submit{border:0;border-radius:9px;background:linear-gradient(135deg,#7764b8,#5d4b94);color:#fff;padding:11px 18px;font:700 11px Oxanium;cursor:pointer}.reply-submit:disabled{opacity:.5;cursor:not-allowed}.topic-empty{padding:50px 20px;text-align:center;border:1px dashed rgba(255,255,255,.1);border-radius:18px;color:#717a86;font:600 13px Oxanium;background:rgba(10,13,18,.7)}.guest-card,.closed-card{padding:20px;border-radius:16px;background:rgba(12,16,23,.8);border:1px solid rgba(255,255,255,.08);margin-top:16px}.guest-card strong,.closed-card strong{display:block;color:#e1e3e8;font:700 14px Oxanium;margin-bottom:7px}.guest-card p,.closed-card p{color:#747e8b;font-size:12px;line-height:1.6;margin:0 0 14px}.guest-link{display:inline-block;padding:10px 14px;border-radius:9px;background:#171420;border:1px solid rgba(139,119,205,.22);color:#c9bdf0;text-decoration:none;font:700 11px Oxanium}.modal.show{display:flex}.modal{display:none}.modal-box{max-width:430px!important}
@media(max-width:850px){.topic-shell{grid-template-columns:1fr}.topic-side{position:static}.reply-card{grid-template-columns:120px minmax(0,1fr)}.reply-user{padding-right:12px}}@media(max-width:600px){.topic-page{width:94%;padding-top:28px}.topic-card{padding:19px;border-radius:16px}.topic-title{font-size:27px}.topic-content{font-size:14px;padding:18px 0}.topic-side{padding:16px}.reply-card{display:block;padding:16px}.reply-user{border-right:0;border-bottom:1px solid rgba(255,255,255,.07);padding:0 0 13px;margin-bottom:14px;display:grid;grid-template-columns:52px 1fr;column-gap:11px;align-items:center}.reply-avatar{grid-row:span 3;margin:0}.reply-user strong{align-self:end}.reply-role{margin-top:2px}.reply-date{margin-top:2px}.reply-composer{padding:15px}.composer-bottom{align-items:flex-end}.composer-hint{max-width:150px}.topic-actions .topic-btn{flex:1}}
</style>
</head>
<body>
<header class="topbar"><a class="logo" href="index.html">EPM</a><nav><a href="index.html">Главная</a><a class="active" href="forum.html">Форум</a><a href="news.html">Новости</a><a href="rules.html">Правила</a><a href="donate.html">Донат</a></nav><div class="account-links"><a href="login.html">Войти</a><a class="account-register" href="register.html">Регистрация</a></div></header>
<main class="topic-page"><a class="topic-back" href="forum.html">← ВЕРНУТЬСЯ К ФОРУМУ</a><div id="topic" class="topic-empty">Загрузка темы...</div></main>
<footer class="site-footer">EPM © 2026</footer>
<div class="modal" id="guestModal"><div class="modal-box"><div class="eyebrow">ДОСТУП К ФУНКЦИИ</div><h2>Вы гость</h2><p>Чтобы отвечать на темы, войдите или зарегистрируйтесь в EPM.</p><div class="modal-actions"><a class="auth-btn secondary" href="login.html">Войти</a><a class="auth-btn primary" href="register.html">Регистрация</a></div><button class="modal-close" id="closeGuest">Закрыть</button></div></div>
<script src="auth.js"></script>
<script>
const topicId=new URLSearchParams(location.search).get('id');
const root=document.getElementById('topic');
const guestModal=document.getElementById('guestModal');
const getTokenSafe=()=>typeof getToken==='function'?getToken():localStorage.getItem('epmToken')||'';
const staffRoles=['Мл.Хелпер','Хелпер','Ст.Хелпер','Мл.Модератор','Модератор','Ст.Модератор','Куратор по рекламе','Куратор по команде проекта','Зам Куратор','Куратор режима','Создатель'];
const isStaff=u=>staffRoles.includes(u?.role);
const esc=s=>{const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML};
const formatDate=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleString('ru-RU',{dateStyle:'medium',timeStyle:'short'})};
const initials=name=>String(name||'EPM').trim().slice(0,2).toUpperCase();
function avatarMarkup(author,cls){const a=author||{};return a.avatar?`<div class="${cls}"><img src="${esc(a.avatar)}" alt="" loading="lazy"></div>`:`<div class="${cls}">${esc(initials(a.nickname))}</div>`}
function showGuest(){guestModal.classList.add('show')}
async function request(url,options={}){const headers={...(options.headers||{})};const token=getTokenSafe();if(token)headers.Authorization='Bearer '+token;const r=await fetch(url,{...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка операции');return d}
async function loadTopic(){
 if(!topicId){root.innerHTML='<div class="topic-empty">Тема не указана.</div>';return}
 try{
  const t=await request('/api/topics/'+encodeURIComponent(topicId));
  const user=typeof restoreSession==='function'?await restoreSession():null;
  const author=t.authorProfile||{nickname:t.author,role:'Пользователь',avatar:''};
  const replies=Array.isArray(t.replies)?t.replies:[];
  const controls=isStaff(user)?`<div class="topic-actions"><button class="topic-btn" id="pinBtn">${t.pinned?'📌 Открепить':'📌 Закрепить'}</button><button class="topic-btn" id="closeBtn">${t.closed?'🔓 Открыть':'🔒 Закрыть'}</button><button class="topic-btn danger" id="deleteBtn">🗑 Удалить</button></div>`:'';
  const replyHtml=replies.map((r,i)=>{const a=r.authorProfile||{nickname:r.author,role:'Пользователь',avatar:''};return `<article class="reply-card"><div class="reply-user">${avatarMarkup(a,'reply-avatar')}<div><strong>${esc(a.nickname||r.author||'Пользователь')}</strong><span class="reply-role">${esc(a.role||r.role||'Пользователь')}</span><span class="reply-date">#${i+1} · ${esc(formatDate(r.createdAt))}</span></div></div><div class="reply-content">${esc(r.content)}</div></article>`}).join('');
  const composer=t.closed?`<div class="closed-card"><strong>🔒 Тема закрыта</strong><p>Новые ответы временно отключены администрацией.</p></div>`:(user?`<form class="reply-composer" id="replyForm"><div class="composer-title">Ваш ответ</div><textarea id="replyText" maxlength="5000" placeholder="Напишите сообщение..." required></textarea><div class="composer-bottom"><span class="composer-hint">Не публикуйте личные данные и пароли.</span><button class="reply-submit" type="submit">Отправить ответ</button></div></form>`:`<div class="guest-card"><strong>💬 Хотите ответить?</strong><p>Войдите в аккаунт EPM или зарегистрируйтесь, чтобы участвовать в обсуждении.</p><button class="guest-link" id="guestReply">Войти и ответить</button></div>`);
  root.className='topic-shell';
  root.innerHTML=`<div class="topic-main"><article class="topic-card"><div class="topic-kicker"><span class="topic-badge">${esc(t.category||'Обсуждение')}</span>${t.pinned?'<span class="topic-badge">📌 Закреплено</span>':''}${t.closed?'<span class="topic-badge closed">🔒 Закрыто</span>':''}</div><h1 class="topic-title">${esc(t.title||'Без названия')}</h1><div class="topic-meta"><span class="author-inline">${avatarMarkup(author,'topic-avatar')}<span>${esc(author.nickname||t.author||'Пользователь')}</span><span class="topic-badge">${esc(author.role||'Пользователь')}</span></span><span>•</span><span>${esc(formatDate(t.createdAt))}</span><span>•</span><span>👁 ${Number(t.views||0)} просмотров</span></div><div class="topic-content">${esc(t.content||'')}</div>${controls}</article><div class="replies-head"><h2>Ответы</h2><span>${replies.length} ${replies.length===1?'ответ':'ответов'}</span></div>${replyHtml||'<div class="topic-empty">Ответов пока нет. Станьте первым участником обсуждения.</div>'}${composer}</div><aside class="topic-side"><div class="side-title">О теме</div><div class="side-stat"><span>Раздел</span><b>${esc(t.category||'Обсуждение')}</b></div><div class="side-stat"><span>Автор</span><b>${esc(author.nickname||t.author||'—')}</b></div><div class="side-stat"><span>Роль</span><b>${esc(author.role||'Пользователь')}</b></div><div class="side-stat"><span>Просмотры</span><b>${Number(t.views||0)}</b></div><div class="side-stat"><span>Ответы</span><b>${replies.length}</b></div><div class="side-stat"><span>Статус</span><b>${t.closed?'Закрыта':'Открыта'}</b></div></aside>`;
  if(isStaff(user)){
   document.getElementById('pinBtn').onclick=async()=>{try{await request('/api/topics/'+topicId+'/pin',{method:'POST'});await loadTopic()}catch(e){alert(e.message)}};
   document.getElementById('closeBtn').onclick=async()=>{try{await request('/api/topics/'+topicId+'/close',{method:'POST'});await loadTopic()}catch(e){alert(e.message)}};
   document.getElementById('deleteBtn').onclick=async()=>{if(!confirm('Удалить тему и все её ответы?'))return;try{await request('/api/topics/'+topicId,{method:'DELETE'});location.href='forum.html'}catch(e){alert(e.message)}};
  }
  if(user&&!t.closed){document.getElementById('replyForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');const text=document.getElementById('replyText').value.trim();if(!text)return;btn.disabled=true;try{await request('/api/topics/'+topicId+'/replies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text})});await loadTopic()}catch(e){alert(e.message)}finally{btn.disabled=false}}}
  if(!user&&!t.closed)document.getElementById('guestReply').onclick=showGuest;
 }catch(e){root.className='topic-empty';root.innerHTML='<strong>Не удалось загрузить тему</strong><br><span>Возможно, тема была удалена.</span>';console.error(e)}
}
document.getElementById('closeGuest').onclick=()=>guestModal.classList.remove('show');
guestModal.onclick=e=>{if(e.target===guestModal)guestModal.classList.remove('show')};
loadTopic();
</script>
</body>
</html>
